name: v2 Registry Gates

# v2/ registry integrity + unit tests gate.
# Hard guard 22a: gate must be wired into CI/build, not just locally run.
# This workflow is independent of the v1 `CI` workflow so that the v2
# rebuild can land without breaking v1 npm test/publish.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-gates:
    name: registry integrity + unit tests
    runs-on: ubuntu-latest
    # Run on every push; no path filter so a registry or gate edit
    # cannot silently bypass the gate.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: v2 registry integrity
        # Default mode: integrity 10/10 must be green. Per-resource
        # gates run for visibility but only fail the build under
        # --strict, which we do NOT enable while v1 is still in place.
        # When v1 src/ is removed (stage 6 of v2/PLAN.md), flip this
        # command to `node v2/gates/run-all.mjs --strict`.
        working-directory: v2
        run: node gates/run-all.mjs

      - name: v2 unit tests
        working-directory: v2
        # 117+ tests across L2 services + L1 error_envelope.
        # Any failure exits non-zero and red-flags this job.
        run: node --test 'tests/unit/**/*.test.mjs'

      - name: v1 src/ untouched by this workflow
        # Sanity check: the v2 rebuild must not touch v1 paths in this
        # branch. We do not fail the build on v1 diffs because other
        # worktrees may legitimately land v1 fixes; this step is
        # informational for reviewers.
        run: |
          if git diff --name-only origin/main -- src/ | grep -q .; then
            echo "::warning::v1 src/ differs from origin/main in this PR; review the diff."
            git diff --name-only origin/main -- src/ || true
          else
            echo "v1 src/ matches origin/main (no v1 changes in this PR)."
          fi
