name: v2 Registry Gates

# v2/ registry integrity + unit tests gate.
# Hard guard 22a: gate must be wired into CI/build, not just locally run.
# This workflow is independent of the v1 `CI` workflow so that the v2
# rebuild can land without breaking v1 npm test/publish.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-gates:
    name: registry integrity + unit tests
    runs-on: ubuntu-latest
    # Run on every push; no path filter so a registry or gate edit
    # cannot silently bypass the gate.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: v2 registry integrity
        # Stage 6 of v2/PLAN.md: v1 src/ is now physically removed.
        # Strict mode is the default — per-resource gates MUST be green
        # or this job fails (hard guard 22a).
        working-directory: v2
        run: node gates/run-all.mjs --strict

      - name: v2 unit tests
        working-directory: v2
        # 117+ tests across L2 services + L1 error_envelope.
        # Any failure exits non-zero and red-flags this job.
        run: node --test 'tests/unit/**/*.test.mjs'

      - name: v2 smoke tests
        working-directory: v2
        run: node --test 'tests/smoke/**/*.test.mjs'

      - name: v2 integration tests
        working-directory: v2
        run: node --test 'tests/integration/**/*.test.mjs'

      - name: v2 e2e lifecycle tests
        working-directory: v2
        # Spawns real daemon subprocesses; verifies lifecycle / multi-profile / cleanup.
        run: node --test 'tests/e2e/**/*.test.mjs'

      - name: v1 src/ untouched by this workflow
        # Stage 6 deletes v1 src/ entirely. This step is informational:
        # Sanity check: the v2 rebuild must not touch v1 paths in this
        # branch. We do not fail the build on v1 diffs because other
        # worktrees may legitimately land v1 fixes; this step is
        # informational for reviewers.
        run: |
          remaining=$(git ls-files src/ 2>/dev/null | wc -l | tr -d ' ')
          if [ "$remaining" -gt 0 ]; then
            echo "::warning::v1 src/ still has $remaining files; review the diff."
            git ls-files src/ || true
          else
            echo "v1 src/ fully removed (stage 6). Strict registry gate is in effect."
          fi
